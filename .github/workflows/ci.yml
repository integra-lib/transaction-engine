# transaction_engine is the only component with dependencies, and on GitHub its
# pipeline cannot get them: crc, bit-ops and dedup-cache are private repositories
# of this organisation, and the default GITHUB_TOKEN reaches its own repository
# only. The standalone build fetches them and dies with
#   fatal: Could not read from remote repository.
# so there is nothing here that could honestly be made green.
#
# GitHub is a staging ground; GitLab is the target, and there a job token can
# reach sibling projects of the same group (subject to the project's job-token
# allowlist). The GitLab pipeline in .gitlab-ci.yml covers this component.
#
# Until then the component is verified locally — 33 tests under gcc and clang,
# plus a consumer project that links it against the three real components.

name: ci

on:
  workflow_dispatch:

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Not run on GitHub: the private sibling components are unreachable" >&2
          echo "from a workflow token. See the comment in this file." >&2
          exit 1
